<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golpe Franco">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Golpe Franco</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Golpe Franco — interfaz.
   Concepto: grafismo de retransmisión deportiva. Bloques inclinados anclados al
   borde izquierdo sobre el estadio en directo; amarillo de tarjeta como único acento. */
:root {
  color-scheme: dark;
  --night: #070b14;
  --panel: #0e1626;
  --panel-2: #17233b;
  --line: #2a3a5e;
  --chalk: #f3f5f9;
  --mute: #93a3c4;
  --card: #ffd23f;
  --card-ink: #17130a;
  --turf: #2bb673;
  --red: #e5484d;
  --display: "Big Shoulders Display", "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --ui: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --skew: -9deg;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--chalk);
  font-family: var(--ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
#app {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--night);
  font-size: clamp(11px, 0.55vw + 0.9vh, 23px);
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ui, #hud { position: absolute; inset: 0; }
#hud { pointer-events: none; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
#fade.cut { animation: cut 0.32s ease-out; }
@keyframes cut { 0% { opacity: 1; } 35% { opacity: 1; } 100% { opacity: 0; } }
.fatal { position: absolute; left: 16px; right: 16px; bottom: 16px; padding: 0.8em 1em; background: var(--red); color: #fff; font-size: 1.1em; z-index: 9; }

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
kbd {
  font: 700 0.8em var(--ui);
  background: var(--chalk); color: var(--night);
  padding: 0.1em 0.5em; border-radius: 0.2em; margin-right: 0.45em; letter-spacing: 0.04em; white-space: nowrap;
}
.mute { color: var(--mute); }
.sm { font-size: 0.92em; }

/* ---------------------------------------------------------------- pantallas */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; gap: 1.1em;
  padding-block: 2em;
  padding-inline: max(16px, 3.2em);
  background: linear-gradient(100deg, rgba(7, 11, 20, 0.94) 0%, rgba(7, 11, 20, 0.78) 45%, rgba(7, 11, 20, 0.35) 100%);
  overflow-y: auto;
}
.hint { margin-top: auto; display: flex; flex-wrap: wrap; gap: 0.4em 1.6em; color: var(--mute); font-size: 1em; padding-top: 0.6em; }
.hint span { white-space: nowrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0.5em 1.5em; min-height: 2.4em;
  font: 700 1.25em var(--ui); letter-spacing: 0.06em;
  background: var(--panel-2); border: 2px solid var(--line);
  transform: skewX(var(--skew));
}
.btn.go { background: var(--turf); border-color: var(--turf); color: #04170d; }
.btn.big { font-size: 1.7em; padding: 0.5em 2em; }
.btn.focus, .btn:focus-visible { background: var(--card); border-color: var(--card); color: var(--card-ink); outline: none; }

.head { display: flex; align-items: baseline; gap: 1em; flex-wrap: wrap; }
.head h1 { font: 900 3.2em/0.95 var(--display); letter-spacing: 0.02em; text-wrap: balance; }
.head-step { font: 700 1.1em var(--ui); color: var(--card-ink); background: var(--card); padding: 0.1em 0.7em; transform: skewX(var(--skew)); }
.head-team { margin-left: auto; display: flex; align-items: center; gap: 0.6em; font-size: 1.4em; }
.head-team img { width: 2em; height: 2em; }

/* -------------------------------------------------------------------- portada */
.s-splash { justify-content: center; align-items: flex-start; gap: 2.4em; background: linear-gradient(100deg, rgba(7, 11, 20, 0.92) 0%, rgba(7, 11, 20, 0.55) 55%, rgba(7, 11, 20, 0.1) 100%); }
.logo-top, .brand-s { font: 700 1.3em var(--ui); letter-spacing: 0.5em; color: var(--card); }
.logo h1 { font: 900 9.5em/0.82 var(--display); letter-spacing: -0.01em; text-transform: uppercase; transform: skewX(var(--skew)); transform-origin: left bottom; }
.logo h1 em, .brand em { font-style: normal; color: var(--card); }
.logo-line { height: 0.5em; width: 62%; margin-top: 1.2em; background: repeating-linear-gradient(90deg, var(--chalk) 0 2.2em, transparent 2.2em 3.4em); transform: skewX(-40deg); transform-origin: left; }
.press { font: 700 1.5em var(--ui); letter-spacing: 0.14em; padding: 0.5em 1.2em; background: var(--card); color: var(--card-ink); transform: skewX(var(--skew)); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }
.splash-note { color: var(--mute); font-size: 1.05em; }

/* ------------------------------------------------------------ menú principal */
.brand { display: flex; flex-direction: column; }
.brand b { font: 900 4.6em/0.85 var(--display); transform: skewX(var(--skew)); transform-origin: left bottom; }
.menu { display: flex; flex-direction: column; gap: 0.35em; margin-top: 0.8em; max-width: 44em; }
.mi {
  display: grid; grid-template-columns: 2.6em 1fr; align-items: baseline; column-gap: 0.4em;
  padding: 0.28em 1.2em 0.28em 0.9em;
  border-left: 0.35em solid transparent;
  transform: skewX(var(--skew)); transform-origin: left;
  transition: transform 0.12s ease-out, background 0.12s;
}
.mi-n { font: 700 1.1em var(--ui); color: var(--mute); }
.mi-t { font: 800 2.7em/1 var(--display); letter-spacing: 0.02em; }
.mi-t small { font: 700 0.34em var(--ui); letter-spacing: 0.16em; margin-left: 0.9em; color: var(--mute); vertical-align: middle; border: 1px solid var(--line); padding: 0.1em 0.5em; }
.mi-d { grid-column: 2; color: var(--mute); font-size: 1.05em; max-height: 0; overflow: hidden; transition: max-height 0.15s; }
.mi-soon .mi-t { color: #9aa6c2; }
.mi.focus { background: var(--card); color: var(--card-ink); border-left-color: var(--chalk); transform: skewX(var(--skew)) translateX(0.8em); }
.mi.focus .mi-n, .mi.focus .mi-d, .mi.focus .mi-t, .mi.focus .mi-t small { color: var(--card-ink); border-color: var(--card-ink); }
.mi.focus .mi-d { max-height: 3em; }
.menu.compact .mi { grid-template-columns: 1fr; }
.menu.compact .mi-t { font-size: 2em; }
.record { position: absolute; right: max(16px, 3.2em); bottom: 4.6em; background: rgba(14, 22, 38, 0.86); border-top: 0.25em solid var(--card); padding: 0.9em 1.3em; }
.record h3 { font: 700 1em var(--ui); letter-spacing: 0.2em; color: var(--mute); margin-bottom: 0.3em; }
.record-row { display: grid; grid-template-columns: repeat(4, auto); column-gap: 1.3em; row-gap: 0; align-items: end; font-variant-numeric: tabular-nums; }
.record-row b { font: 900 2.4em/1 var(--display); grid-row: 1; }
.record-row span { font-size: 0.8em; letter-spacing: 0.12em; color: var(--mute); grid-row: 2; }
.record-sub { margin-top: 0.5em; color: var(--mute); }

.modal { margin: auto 0; max-width: 34em; background: var(--panel); border-left: 0.4em solid var(--card); padding: 1.8em 2em; display: flex; flex-direction: column; gap: 0.9em; align-items: flex-start; }
.modal h2 { font: 900 3em/1 var(--display); }
.modal p { font-size: 1.25em; line-height: 1.35; }
.modal-tag, .report-tag { font: 700 1em var(--ui); letter-spacing: 0.24em; color: var(--card-ink); background: var(--card); padding: 0.1em 0.7em; align-self: flex-start; transform: skewX(var(--skew)); }

/* ----------------------------------------------------------------- equipos */
.vs-wrap { display: flex; align-items: stretch; gap: 1.2em; flex-wrap: wrap; }
.team { flex: 1 1 18em; min-width: 0; background: rgba(14, 22, 38, 0.9); border-top: 0.45em solid var(--tc); padding: 1em 1.3em 1.2em; display: flex; flex-direction: column; gap: 0.8em; position: relative; }
.team.mine { box-shadow: inset 0 0 0 2px var(--card); }
.team-tag { font: 700 1.05em var(--ui); letter-spacing: 0.24em; color: var(--mute); display: flex; gap: 0.8em; align-items: center; }
.team-tag b { background: var(--card); color: var(--card-ink); padding: 0 0.6em; letter-spacing: 0.1em; }
.team-tag i { font-style: normal; border: 1px solid var(--line); padding: 0 0.6em; letter-spacing: 0.1em; }
.team-pick { display: flex; align-items: center; gap: 0.8em; padding: 0.5em; border: 2px solid transparent; }
.team-pick.focus, .row.focus, .slider.focus { border-color: var(--card); background: rgba(255, 210, 63, 0.09); }
.team-id { flex: 1; min-width: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 1em; align-items: center; }
.team-id .crest { width: 6.4em; height: 6.4em; grid-row: 1 / 3; filter: drop-shadow(0 0.3em 0.5em rgba(0, 0, 0, 0.5)); }
.team-id h2 { font: 900 2.5em/0.95 var(--display); align-self: end; overflow-wrap: anywhere; }
.team-id p { color: var(--mute); font-size: 1.1em; align-self: start; }
.arrow { font-size: 1.5em; width: 1.7em; height: 1.7em; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); flex: none; }
.arrow:hover { background: var(--card); color: var(--card-ink); }
.arrow.sm { font-size: 0.9em; }
.team-ovr { position: absolute; top: 0.9em; right: 1.2em; text-align: right; line-height: 1; }
.team-ovr b { font: 900 2.8em/0.9 var(--display); display: block; color: var(--card); }
.team-ovr span { font-size: 0.8em; letter-spacing: 0.16em; color: var(--mute); }
.stats { display: flex; flex-direction: column; gap: 0.35em; }
.stat { display: grid; grid-template-columns: 5.2em 1fr 2em; align-items: center; gap: 0.7em; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 0.95em; letter-spacing: 0.14em; color: var(--mute); }
.stat-b { height: 0.6em; background: var(--panel-2); transform: skewX(-25deg); overflow: hidden; }
.stat-b i { display: block; height: 100%; background: linear-gradient(90deg, var(--tc), var(--ta)); }
.stat-v { font: 700 1.25em var(--ui); text-align: right; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 1em; flex-wrap: wrap; padding: 0.4em 0.6em; border: 2px solid transparent; }
.row-l { font-size: 1em; letter-spacing: 0.16em; color: var(--mute); }
.row-v { display: flex; align-items: center; gap: 0.6em; flex-wrap: wrap; }
.row-v b { font: 700 1.3em var(--ui); letter-spacing: 0.04em; min-width: 5em; text-align: center; }
.row-v.full { flex: 1; justify-content: space-between; }
.chip { display: inline-flex; align-items: center; gap: 0.5em; padding: 0.2em 0.7em; border: 1px solid var(--line); font-weight: 700; letter-spacing: 0.06em; }
.chip.on { background: var(--chalk); color: var(--night); border-color: var(--chalk); }
.kit { display: inline-flex; flex-direction: column; width: 1.15em; height: 1.4em; outline: 1px solid rgba(255, 255, 255, 0.45); }
.kit i { display: block; }
.kit-sl { display: none; }
.kit-body { flex: 7; }
.kit-sh { flex: 3; }
.style { display: flex; gap: 0.6em; flex-wrap: wrap; }
.style span { font-size: 0.95em; letter-spacing: 0.12em; border: 1px solid var(--line); padding: 0.1em 0.6em; color: var(--mute); }
.vs { align-self: center; font: 900 3.4em var(--display); color: var(--card); transform: skewX(var(--skew)); }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 1em; flex-wrap: wrap; }
.row-wide { background: rgba(14, 22, 38, 0.9); flex: 1 1 20em; }

/* ----------------------------------------------------------------- táctica */
.tac { display: flex; gap: 1.4em; align-items: flex-start; flex-wrap: wrap; }
.tac h3, .col h3 { font: 700 1em var(--ui); letter-spacing: 0.24em; color: var(--card); margin: 0.2em 0 0.4em; }
.tac-forms { display: flex; flex-direction: column; gap: 0.3em; flex: 0 0 9em; }
.opt { font: 800 1.7em var(--display); padding: 0.12em 0.7em; background: rgba(14, 22, 38, 0.9); border-left: 0.3em solid var(--line); transform: skewX(var(--skew)); }
.opt.on { border-left-color: var(--turf); color: var(--turf); }
.opt.focus { background: var(--card); color: var(--card-ink); border-left-color: var(--chalk); }
.pitch { flex: 1 1 22em; min-width: 0; max-width: 34em; perspective: 60em; padding-top: 0.5em; }
.pitch-in {
  position: relative; width: 100%; aspect-ratio: 68 / 74;
  background: repeating-linear-gradient(180deg, #2b7a35 0 12.5%, #318a3c 12.5% 25%);
  border: 0.18em solid rgba(255, 255, 255, 0.85);
  transform: rotateX(34deg); transform-origin: 50% 100%; transform-style: preserve-3d;
  box-shadow: 0 1.2em 2.4em rgba(0, 0, 0, 0.55);
}
.pl-mid { position: absolute; left: 0; right: 0; top: 14%; border-top: 0.14em solid rgba(255, 255, 255, 0.8); }
.pl-circle { position: absolute; left: 50%; top: 14%; width: 26%; aspect-ratio: 1; border: 0.14em solid rgba(255, 255, 255, 0.8); border-radius: 50%; transform: translate(-50%, -50%); }
.pl-box { position: absolute; left: 21%; right: 21%; border: 0.14em solid rgba(255, 255, 255, 0.8); }
.pl-box.a { bottom: 0; height: 19%; border-bottom: 0; }
.pl-box.b { display: none; }
.tok { position: absolute; transform: translate(-50%, -50%) rotateX(-34deg); transform-origin: 50% 100%; display: flex; flex-direction: column; align-items: center; line-height: 1.05; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); white-space: nowrap; }
.tok b { width: 1.9em; height: 1.9em; display: grid; place-items: center; border-radius: 50%; background: var(--c); color: var(--n); font: 800 1.15em var(--ui); border: 2px solid rgba(255, 255, 255, 0.9); box-shadow: 0 0.3em 0.5em rgba(0, 0, 0, 0.5); }
.tok span { font-weight: 700; font-size: 0.95em; }
.tok em { font-style: normal; font-size: 0.75em; color: #d7e6d9; }
.tac-side { flex: 1 1 17em; min-width: 0; max-width: 24em; display: flex; flex-direction: column; gap: 0.35em; background: rgba(14, 22, 38, 0.9); padding: 0.9em 1.1em 1.1em; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 0.15em 0.8em; padding: 0.3em 0.6em; border: 2px solid transparent; }
.slider-l { font-size: 0.95em; letter-spacing: 0.14em; }
.slider-t { grid-column: 1 / 3; height: 0.55em; background: var(--panel-2); transform: skewX(-25deg); overflow: hidden; }
.slider-t i { display: block; height: 100%; background: var(--card); }
.slider-e { grid-column: 1 / 3; display: flex; justify-content: space-between; font-size: 0.8em; color: var(--mute); }
.slider-e em { font-style: normal; }
.slider-n { font-weight: 700; font-variant-numeric: tabular-nums; }
.tac-side .btn { margin-top: 0.7em; align-self: flex-start; }

/* ------------------------------------------------------- ajustes de partido */
.setup { display: flex; gap: 1.6em; flex-wrap: wrap; align-items: flex-start; }
.diffs { flex: 1 1 22em; min-width: 0; display: flex; flex-direction: column; gap: 0.5em; max-width: 36em; }
.diff { display: grid; grid-template-columns: 4.2em 1fr; column-gap: 0.8em; align-items: center; padding: 0.55em 1em; background: rgba(14, 22, 38, 0.9); border-left: 0.35em solid var(--line); transform: skewX(var(--skew)); }
.diff-n { grid-row: 1 / 3; color: var(--mute); letter-spacing: 0.12em; font-size: 0.9em; }
.diff b { font: 800 1.9em/1 var(--display); }
.diff span:last-child { color: var(--mute); font-size: 1.02em; }
.diff.on { border-left-color: var(--turf); }
.diff.on b { color: var(--turf); }
.diff.focus { background: var(--card); color: var(--card-ink); }
.diff.focus b, .diff.focus span { color: var(--card-ink); }
.opts { flex: 1 1 18em; min-width: 0; max-width: 28em; display: flex; flex-direction: column; gap: 0.4em; background: rgba(14, 22, 38, 0.9); padding: 0.9em 1.1em 1.2em; }
.opts .btn { margin-top: 0.8em; align-self: flex-start; }

.loading { margin: auto; text-align: center; display: flex; flex-direction: column; gap: 0.8em; align-items: center; }
.load-vs { display: flex; align-items: center; gap: 2em; }
.load-vs img { width: 9em; height: 9em; }
.load-vs b { font: 900 3.5em var(--display); color: var(--card); }
.loading h2 { font: 800 2.4em var(--display); text-wrap: balance; }
.loading p { color: var(--mute); font-size: 1.2em; letter-spacing: 0.12em; }
.s-loading { background: var(--night); }

.cols { display: flex; gap: 1.6em; flex-wrap: wrap; align-items: flex-start; }
.col { flex: 1 1 17em; min-width: 0; max-width: 30em; display: flex; flex-direction: column; gap: 0.35em; background: rgba(14, 22, 38, 0.9); padding: 0.9em 1.1em 1.2em; }
.col .btn { align-self: flex-start; margin-top: 0.5em; }
.keys { border-collapse: collapse; font-size: 1.12em; }
.keys td { padding: 0.22em 0.4em 0.22em 0; vertical-align: top; }

/* ------------------------------------------------------- pausa y resúmenes */
.s-pause, .s-half, .s-full { background: rgba(7, 11, 20, 0.82); }
.pause { margin: auto 0; display: flex; flex-direction: column; gap: 0.6em; }
.pause h1 { font: 900 4.2em/0.9 var(--display); color: var(--card); transform: skewX(var(--skew)); transform-origin: left; }
.pause-score { display: flex; align-items: center; gap: 1em; font-size: 1.35em; flex-wrap: wrap; }
.pause-score.big { font-size: 1.7em; justify-content: center; }
.sl-team { display: flex; align-items: center; gap: 0.5em; font-weight: 700; flex: 1 1 0; min-width: 0; justify-content: flex-end; text-align: right; }
.sl-team.r { justify-content: flex-start; text-align: left; }
.pause .sl-team { flex: 0 1 auto; }
.sl-team img { width: 2.2em; height: 2.2em; flex: none; }
.sl-score { font: 900 2.2em/1 var(--display); background: var(--chalk); color: var(--night); padding: 0.05em 0.5em; transform: skewX(var(--skew)); font-variant-numeric: tabular-nums; white-space: nowrap; }
.report { margin: auto; width: min(100%, 46em); display: flex; flex-direction: column; gap: 0.8em; }
.report-tag { align-self: center; }
.verdict { font: 900 4.4em/0.9 var(--display); text-align: center; color: var(--card); }
.scorers { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1em; color: var(--mute); font-size: 1.1em; }
.scorers div { display: flex; flex-direction: column; align-items: flex-end; }
.scorers div:last-child { align-items: flex-start; }
.scorers .dot { width: 0.7em; height: 0.7em; border-radius: 50%; background: var(--chalk); margin-top: 0.3em; }
.stt { display: flex; flex-direction: column; gap: 0.3em; background: rgba(14, 22, 38, 0.9); padding: 0.9em 1.2em; font-variant-numeric: tabular-nums; }
.stt-r { display: grid; grid-template-columns: 4em 1fr 4em; align-items: center; gap: 0.8em; }
.stt-r > b { font: 700 1.3em var(--ui); text-align: center; }
.stt-m span { display: block; text-align: center; font-size: 0.85em; letter-spacing: 0.18em; color: var(--mute); }
.stt-b { display: flex; justify-content: space-between; height: 0.4em; background: var(--panel-2); gap: 2px; }
.stt-b i { background: var(--hc); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35); }
.stt-b u { background: var(--ac); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35); }
.report-btns { display: flex; gap: 1em; justify-content: center; flex-wrap: wrap; margin-top: 0.4em; }

/* --------------------------------------------------------------------- HUD */
.sb {
  position: absolute; top: max(16px, 1.4em); left: max(16px, 1.8em);
  display: flex; align-items: stretch; font-size: 1.15em;
  transform: skewX(var(--skew)); transform-origin: left top;
  box-shadow: 0 0.3em 0.9em rgba(0, 0, 0, 0.45);
}
.sb-team { display: flex; align-items: center; gap: 0.45em; padding: 0.25em 0.7em; background: var(--panel); font: 800 1.35em var(--ui); letter-spacing: 0.06em; }
.sb-team.h { border-bottom: 0.22em solid var(--hc); }
.sb-team.a { border-bottom: 0.22em solid var(--ac); }
.sb-crest { width: 1.5em; height: 1.5em; }
.sb-score { display: flex; align-items: center; gap: 0.3em; padding: 0 0.6em; background: var(--chalk); color: var(--night); font: 900 1.9em/1 var(--display); font-variant-numeric: tabular-nums; }
.sb-score i { font-style: normal; opacity: 0.5; }
.sb-clock { display: flex; align-items: center; gap: 0.4em; padding: 0 0.7em; background: var(--card); color: var(--card-ink); font: 700 1.3em var(--ui); font-variant-numeric: tabular-nums; }
.sb-half { font-style: normal; font-size: 0.75em; opacity: 0.75; }
.sb-time.extra { color: #a01218; }

.banner { position: absolute; left: 0; right: 0; top: 19%; display: flex; justify-content: center; }
.banner-in { display: flex; flex-direction: column; align-items: center; padding: 0.3em 2.2em 0.4em; background: rgba(14, 22, 38, 0.92); border-bottom: 0.3em solid var(--card); transform: skewX(var(--skew)); animation: slab 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
.banner b { font: 900 3.2em/1 var(--display); letter-spacing: 0.03em; }
.banner span { font-size: 1.2em; color: var(--mute); letter-spacing: 0.08em; }
.banner.alert .banner-in { background: var(--red); border-bottom-color: #fff; }
.banner.alert span { color: #fff; }
.banner.yellow .banner-in { background: var(--card); color: var(--card-ink); border-bottom-color: var(--card-ink); }
.banner.yellow span { color: var(--card-ink); }
.banner.intro { top: auto; bottom: 14%; }
.banner.intro b { font-size: 2.6em; }
@keyframes slab { from { transform: skewX(var(--skew)) translateX(-3em); opacity: 0; } }

.goal { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 12vh; gap: 0.2em; }
.goal-word { font: 900 11em/0.85 var(--display); color: var(--chalk); -webkit-text-stroke: 0.03em var(--night); text-shadow: 0.06em 0.06em 0 var(--gc, #000), 0 0.15em 0.6em rgba(0, 0, 0, 0.6); transform: skewX(var(--skew)); animation: goal 0.5s cubic-bezier(0.2, 1.4, 0.4, 1); }
.goal-who { font-size: 1.7em; background: rgba(14, 22, 38, 0.92); padding: 0.15em 1.2em; border-bottom: 0.2em solid var(--card); }
@keyframes goal { from { transform: skewX(var(--skew)) scale(2.6); opacity: 0; } }

.replay { position: absolute; top: max(16px, 1.4em); right: max(16px, 1.8em); display: flex; flex-direction: column; align-items: flex-end; gap: 0.2em; }
.replay b { font: 900 2em var(--display); background: var(--red); padding: 0 0.6em; transform: skewX(var(--skew)); letter-spacing: 0.06em; }
.replay span { color: var(--chalk); background: rgba(7, 11, 20, 0.7); padding: 0 0.6em; }

.caption { position: absolute; left: 50%; bottom: max(16px, 1.3em); transform: translateX(-50%); max-width: min(46em, calc(100% - 32px)); text-align: center; font-size: 1.35em; line-height: 1.2; background: rgba(7, 11, 20, 0.82); padding: 0.25em 1em; border-left: 0.25em solid var(--card); }

.me { position: absolute; left: max(16px, 1.8em); bottom: max(16px, 1.4em); display: flex; align-items: stretch; transform: skewX(var(--skew)); transform-origin: left bottom; box-shadow: 0 0.3em 0.9em rgba(0, 0, 0, 0.45); }
.me-num { display: grid; place-items: center; min-width: 1.9em; background: var(--card); color: var(--card-ink); font: 900 2.2em var(--display); padding: 0 0.2em; }
.me-info { background: var(--panel); padding: 0.25em 0.9em 0.4em; min-width: 11em; }
.me-name { display: block; font: 700 1.35em var(--ui); white-space: nowrap; }
.me-pos { font-size: 0.9em; color: var(--mute); letter-spacing: 0.1em; }
.me-st { height: 0.3em; background: var(--panel-2); margin-top: 0.3em; }
.me-st i { display: block; height: 100%; background: var(--turf); }
.me-st i.low { background: var(--red); }

.power { position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); width: min(18em, 60%); text-align: center; }
.power-l { font: 700 1em var(--ui); letter-spacing: 0.16em; text-shadow: 0 1px 4px #000; }
.power-b { height: 0.75em; background: rgba(7, 11, 20, 0.75); border: 2px solid var(--chalk); transform: skewX(-25deg); overflow: hidden; margin-top: 0.2em; }
.power-b i { display: block; height: 100%; background: linear-gradient(90deg, var(--turf), var(--card)); }
.power-b i.hot { background: linear-gradient(90deg, var(--card), var(--red)); }

.help { position: absolute; right: max(16px, 1.8em); bottom: 4.6em; max-width: min(34em, 46%); background: rgba(7, 11, 20, 0.8); padding: 0.3em 0.9em; font-size: 1.05em; border-right: 0.25em solid var(--card); text-align: right; }
.radar { position: absolute; right: max(16px, 1.8em); top: max(16px, 1.4em); width: 12.5em; height: auto; opacity: 0.92; }
.cards { position: absolute; top: 5em; left: max(16px, 1.8em); display: flex; flex-direction: column; gap: 0.3em; }
.card-pop { display: flex; align-items: center; gap: 0.5em; background: rgba(14, 22, 38, 0.92); padding: 0.2em 0.8em 0.2em 0.4em; font-size: 1.15em; animation: slab 0.25s ease-out; }
.card-pop i { width: 0.7em; height: 1em; background: var(--card); }
.card-pop.r i { background: var(--red); }

@media (max-width: 700px) {
  .record { position: static; align-self: flex-start; }
  .logo h1 { font-size: 6em; }
  .radar { display: none; }
  .help { display: none; }
  .vs { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .press, .banner-in, .goal-word, .card-pop { animation: none; }
  .mi { transition: none; }
}

/* ---------------------------------------------------------- Modo carrera */
.car-list { display: grid; gap: 10px; width: min(640px, 92vw); margin: 0 auto; }
.car-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.car-main {
  display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer;
  background: var(--panel); color: var(--chalk); border: 1px solid var(--line); padding: 12px 16px;
  font: inherit;
}
.car-main.focus, .car-main:hover, .car-del.focus, .car-offer.focus, .car-input:focus { border-color: var(--card); }
.car-crest { width: 44px; height: 44px; object-fit: contain; }
.car-txt { display: grid; gap: 2px; }
.car-txt b { font-family: var(--display); font-size: 1.3em; letter-spacing: .02em; }
.car-txt small, .car-head small { color: var(--mute); font-size: .95em; }
.car-del {
  background: transparent; color: var(--mute); border: 1px solid var(--line); padding: 0 14px;
  font-family: var(--ui); font-weight: 700; letter-spacing: .08em; cursor: pointer;
}
.car-del:hover, .car-del.focus { color: var(--red); border-color: var(--red); }
.car-new { width: min(560px, 92vw); margin: 0 auto; display: grid; gap: 14px; }
.car-field { display: grid; gap: 6px; color: var(--mute); font-family: var(--ui); letter-spacing: .08em; font-weight: 700; }
.car-input {
  background: var(--panel); color: var(--chalk); border: 1px solid var(--line); padding: 12px 14px;
  font: 600 1.2em var(--ui); outline: none;
}
.car-club { margin: 0; }
.car-head { display: flex; align-items: center; gap: 16px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
.car-head b { font-family: var(--display); font-size: 1.8em; display: block; }
.car-season { margin-left: auto; text-align: right; font-family: var(--display); font-size: 1.4em; font-weight: 800; }
.car-body { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 20px 24px; }
.car-body h3, .car-h { font-family: var(--ui); letter-spacing: .12em; color: var(--mute); margin: 0 0 12px; }
.car-next { display: grid; gap: 12px; align-content: start; }
.car-match { text-align: center; background: var(--panel); border: 1px solid var(--line); padding: 18px; }
.car-match > span { font-family: var(--ui); letter-spacing: .12em; color: var(--mute); }
.car-vs { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 8px 0; }
.car-vs img { width: 64px; height: 64px; object-fit: contain; }
.car-vs b { font-family: var(--display); font-size: 1.6em; }
.car-rep { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-family: var(--ui); color: var(--mute); }
.car-table .ct { display: grid; grid-template-columns: 36px 1fr 46px 46px 50px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-family: var(--ui); }
.car-table .ct span, .car-table .ct b { text-align: right; }
.car-table .ct span:nth-child(2) { text-align: left; }
.car-table .ct-h { color: var(--mute); letter-spacing: .08em; font-size: .9em; }
.car-table .ct.me { background: var(--panel-2); color: var(--card); }
.car-foot { padding: 0 24px 12px; }
.car-sum { text-align: center; color: var(--mute); margin: 6px 0; }
.car-offers { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 10px 0; }
.car-offer {
  display: flex; align-items: center; gap: 12px; background: var(--panel); color: var(--chalk);
  border: 1px solid var(--line); padding: 10px 16px; cursor: pointer; font: inherit; text-align: left;
}
.car-offer img { width: 48px; height: 48px; object-fit: contain; }
.car-offer small { display: block; color: var(--mute); }
@media (max-width: 760px) { .car-body { grid-template-columns: 1fr; } }

/* ---------------------------------- Carrera: jugador, mercado y contratos */
.car-info { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 10px 24px; border-bottom: 1px solid var(--line); font-family: var(--ui); color: var(--mute); letter-spacing: .04em; }
.car-info b { color: var(--chalk); font-size: 1.1em; margin-left: 4px; }
.car-hurt { color: var(--red); font-weight: 700; }
.car-btns { display: grid; gap: 8px; }
.car-msg { color: var(--card); font-family: var(--ui); font-weight: 700; margin: 0; }
.car-pts { text-align: center; font-family: var(--ui); color: var(--mute); margin: 8px 0; }
.car-pts b { color: var(--card); font-size: 1.1em; }
.car-player { width: min(760px, 94vw); margin: 0 auto; display: grid; gap: 14px; }
.car-pl-top { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; }
.car-ovr, .car-pool { text-align: center; background: var(--panel); border: 1px solid var(--line); padding: 8px 18px; }
.car-ovr b, .car-pool b { display: block; font-family: var(--display); font-size: 2.2em; line-height: 1; }
.car-ovr span, .car-pool span { font-family: var(--ui); color: var(--mute); letter-spacing: .1em; font-size: .85em; }
.car-pool.ok b { color: var(--turf); }
.car-attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }
.car-attr { display: grid; grid-template-columns: 110px 1fr 36px auto auto; gap: 8px; align-items: center; font-family: var(--ui); }
.car-attr b { text-align: right; }
.car-attr-l { color: var(--mute); letter-spacing: .06em; }
.car-attr.focus, .mk-row.focus, .car-attr:focus-within { outline: 1px solid var(--card); }
.mk-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: min(1000px, 96vw); margin: 0 auto; }
.mk-cols h3, .car-contracts + p { font-family: var(--ui); letter-spacing: .12em; color: var(--mute); }
.mk-list { display: grid; gap: 4px; max-height: 58vh; overflow-y: auto; padding-right: 4px; }
.mk-row {
  display: grid; grid-template-columns: 44px 1fr 40px 40px 1fr auto; gap: 8px; align-items: center;
  background: var(--panel); color: var(--chalk); border: 1px solid var(--line); padding: 8px 10px;
  font: inherit; font-family: var(--ui); text-align: left; cursor: pointer;
}
.mk-row:hover { border-color: var(--card); }
.mk-pos { color: var(--card); font-weight: 800; }
.mk-ovr { font-family: var(--display); font-size: 1.2em; }
.mk-age, .mk-club { color: var(--mute); font-size: .9em; }
.mk-price { text-align: right; white-space: nowrap; }
.mk-hurt { font-style: normal; color: var(--red); font-size: .8em; font-weight: 800; }
.car-contracts .mk-row { grid-template-columns: 48px 1fr 40px auto; }
.car-crest.sm { width: 36px; height: 36px; }
@media (max-width: 760px) { .mk-cols, .car-attrs { grid-template-columns: 1fr; } .car-pl-top { grid-template-columns: 1fr 1fr; } }

/* ------------------------------------------------------------ Avisos */
#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 12px); opacity: 0;
  background: var(--panel); color: var(--chalk); border: 1px solid var(--card);
  padding: 10px 18px; font-family: var(--ui); font-weight: 700; letter-spacing: .06em;
  pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.pad-table { width: 100%; border-collapse: collapse; font-family: var(--ui); }
.pad-table td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
.pad-table td:nth-child(2), .pad-table td:nth-child(3) { white-space: nowrap; text-align: center; }
.pad-table td:nth-child(2) b, .pad-table td:nth-child(3) b { color: var(--card); }

/* ------------------------------------------------ Controles personalizados */
.bind-wrap { width: min(720px, 94vw); margin: 0 auto; display: grid; gap: 4px; }
.bind-row { display: grid; grid-template-columns: 1fr 180px 180px; gap: 8px; align-items: center; font-family: var(--ui); padding: 4px 0; border-bottom: 1px solid var(--line); }
.bind-h { color: var(--mute); letter-spacing: .1em; font-size: .9em; border-bottom: 2px solid var(--line); }
.bind-btn { background: var(--panel); color: var(--chalk); border: 1px solid var(--line); padding: 8px 10px; font: 700 1em var(--ui); letter-spacing: .06em; cursor: pointer; }
.bind-btn.focus, .bind-btn:hover { border-color: var(--card); color: var(--card); }
.bind-btn.esperando { border-color: var(--card); color: var(--card); animation: blink .8s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

/* ------------------------------------------------------- Personalizar */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(160px, 1fr)); gap: 22px; width: min(960px, 94vw); margin: 4vh auto 0; }
.tile {
  display: grid; justify-items: center; gap: 12px; padding: 34px 18px; cursor: pointer;
  background: var(--panel); color: var(--chalk); border: 1px solid var(--line); font: inherit;
  transition: transform .15s, border-color .15s;
}
.tile.focus, .tile:hover { border-color: var(--card); transform: translateY(-3px); }
.tile-ico { width: 84px; height: 84px; color: var(--card); }
.tile-ico svg { width: 100%; height: 100%; }
.tile b { font-family: var(--display); font-size: 1.9em; letter-spacing: .04em; }
.tile small { color: var(--mute); text-align: center; font-family: var(--ui); font-size: 1.05em; }
@media (max-width: 760px) { .tiles { grid-template-columns: 1fr; } }

.pl-top { display: flex; justify-content: flex-end; width: min(900px, 94vw); margin: 0 auto 10px; }
.pl-list { width: min(900px, 94vw); margin: 0 auto; display: grid; gap: 4px; max-height: 66vh; overflow-y: auto; padding-right: 6px; }
.pl-list.small { max-height: 60vh; }
.pl-row {
  display: grid; grid-template-columns: 48px minmax(0, 1fr) 70px 56px auto; gap: 10px; align-items: center;
  background: var(--panel); color: var(--chalk); border: 1px solid var(--line); padding: 6px 10px;
  font-family: var(--ui); font-size: 1.05em; text-align: left; font-weight: 600;
}
button.pl-row { cursor: pointer; font: inherit; }
.pl-row.focus, button.pl-row:hover { border-color: var(--card); }
.pl-row.on { background: var(--panel-2); }
.pl-pos { color: var(--card); font-weight: 800; }
.pl-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-club { color: var(--mute); font-size: .9em; text-align: center; }
.pl-ovr { font-family: var(--display); font-size: 1.3em; text-align: center; }
.pl-crest { width: 36px; height: 36px; object-fit: contain; justify-self: center; }
.pl-row.pick { grid-template-columns: 48px minmax(0, 1fr) 70px 46px 30px; }
.check { color: var(--turf); font-size: 1.2em; text-align: center; }
.tag { font-style: normal; font-size: .7em; color: #04170d; background: var(--card); padding: 1px 6px; margin-left: 6px; letter-spacing: .08em; vertical-align: middle; }
.ico { width: 40px; height: 36px; display: inline-grid; place-items: center; background: transparent; color: var(--mute); border: 1px solid var(--line); cursor: pointer; padding: 6px; }
.ico svg { width: 100%; height: 100%; }
.ico.focus, .ico:hover { color: var(--card); border-color: var(--card); }
.ico.del.focus, .ico.del:hover { color: var(--red); border-color: var(--red); }
.ico.del.sure { width: auto; padding: 0 10px; font-family: var(--ui); font-weight: 800; color: var(--red); border-color: var(--red); }
.ico-liga { display: inline-grid; place-items: center; color: var(--card); }
.ico-liga svg { width: 70%; height: 70%; }
.ico-liga.big { width: 96px; height: 96px; }
.ico-liga.big svg { width: 100%; height: 100%; }
.pe-wrap { width: min(1100px, 96vw); margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: start; }
.pe-col { display: grid; gap: 10px; align-content: start; }
.pe-col h3 { font-family: var(--ui); letter-spacing: .12em; color: var(--mute); margin: 8px 0 0; }
.pe-ovr { text-align: center; background: var(--panel); border: 1px solid var(--line); padding: 8px; }
.pe-ovr b { display: block; font-family: var(--display); font-size: 2.4em; line-height: 1; }
.pe-ovr span { font-family: var(--ui); color: var(--mute); letter-spacing: .1em; }
.pe-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.pe-btns .btn { flex: 1; }
.swatches { display: inline-flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.sw, .kit-sw { display: inline-block; width: 16px; height: 16px; border: 1px solid #0006; }
.sw.on { outline: 2px solid var(--card); outline-offset: 1px; }
.logo-box { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--line); padding: 10px; }
.logo-prev { width: 96px; height: 96px; object-fit: contain; flex: none; }
.logo-btns { display: grid; gap: 8px; }
.kit-prev { display: flex; justify-content: center; padding: 6px; }
.car-attr { display: grid; grid-template-columns: 110px 1fr 36px auto auto; gap: 8px; align-items: center; font-family: var(--ui); }
.car-msg { color: var(--card); font-family: var(--ui); font-weight: 700; }
.car-sum { font-family: var(--ui); }

/* ---------------------------------------------- Buscador de personalización */
.pl-top { gap: 12px; align-items: center; }
.pl-search {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
  background: var(--panel); border: 1px solid var(--line); padding: 0 12px;
  color: var(--mute); cursor: text;
}
.pl-search:focus-within { border-color: var(--card); color: var(--chalk); }
.pl-search svg { width: 22px; height: 22px; flex: none; }
.pl-search input {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
  color: var(--chalk); font: 600 1.05em var(--ui); padding: 9px 0;
}
.pl-search input::placeholder { color: var(--mute); opacity: .8; }
.pl-row[hidden] { display: none; }
.pl-empty { margin: 24px 0; text-align: center; color: var(--mute); font: 600 1.15em var(--ui); }

/* ------------------------------------------------- Base de datos (oculta) */
.db-gate {
  position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
  background: rgba(4, 8, 12, .72);
}
.db-box {
  width: min(34em, 92vw); background: var(--panel); color: var(--chalk);
  border-left: .4em solid var(--card); padding: 1.6em 1.8em;
  display: flex; flex-direction: column; gap: .8em; font-family: var(--ui);
}
.db-box h2 { font: 900 2.2em/1 var(--display); }
.db-box .btn { align-self: stretch; }
.db-box-pass { width: min(26em, 90vw); }
.db-pass {
  width: 100%; background: var(--panel-2); color: var(--chalk); border: 1px solid var(--line);
  font: 700 1.3em var(--ui); padding: .5em .7em; outline: none; text-align: center;
}
.db-pass:focus { border-color: var(--card); }
.db-desc { font-size: .95em; color: var(--mute); margin-top: -.4em; }
.db-msg { min-height: 1.2em; color: var(--red); font-size: 1em; }
.db-btn {
  position: fixed; top: 16px; right: 16px; z-index: 900; width: 58px; height: 58px;
  background: var(--card); color: #04170d; border: 0; cursor: pointer;
  font: 800 1.1em var(--ui); letter-spacing: .06em;
}
.db-btn:hover { filter: brightness(1.1); }
.db-btn:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }

/* ------------------------------------------------------------ Torneos */
.tp-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.tp-row small { color: var(--mute); font-weight: 500; }
.tb-wrap { width: min(1000px, 94vw); margin: 0 auto; display: grid; gap: 16px; }
.tb-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.tb-table { background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; font-family: var(--ui); }
.tb-table h4 { font: 800 1.1em var(--ui); letter-spacing: .14em; color: var(--mute); margin-bottom: 4px; }
.tb-table table { width: 100%; border-collapse: collapse; font-size: .95em; }
.tb-table th, .tb-table td { padding: 3px 4px; text-align: right; color: var(--chalk); }
.tb-table th { color: var(--mute); font-weight: 600; }
.tb-table td:nth-child(2), .tb-table th:nth-child(2) { text-align: left; }
.tb-table tr.q td { color: var(--turf); }
.tb-table .tb-res { margin-top: 6px; font-size: .9em; color: var(--mute); line-height: 1.5; }
.tb-rounds { display: flex; gap: 18px; align-items: stretch; overflow-x: auto; padding-bottom: 6px; }
.tb-round { display: flex; flex-direction: column; gap: 10px; justify-content: space-around; min-width: 210px; }
.tb-round h4 { font: 800 1em var(--ui); letter-spacing: .14em; color: var(--mute); text-align: center; }
.tb-m { background: var(--panel); border: 1px solid var(--line); font-family: var(--ui); font-weight: 600; }
.tb-m > div { display: flex; justify-content: space-between; gap: 10px; padding: 5px 9px; color: var(--mute); }
.tb-m > div.win { color: var(--chalk); background: var(--panel-2); }
.tb-m b { color: var(--chalk); }
.tb-champ { font: 900 2.2em/1 var(--display); text-align: center; color: var(--turf); padding: 8px 0; }
.tb-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---- Carta de jugador (estilo FC) ---- */
.pe-card { display: grid; justify-items: center; }
.jcard {
  width: min(250px, 100%); aspect-ratio: 5 / 7; display: flex; flex-direction: column;
  gap: 4px; padding: 12px 12px 10px; border-radius: 16px 16px 8px 8px; box-sizing: border-box;
  box-shadow: 0 10px 24px rgba(0, 0, 0, .45); overflow: hidden;
}
.jcard-oro { background: linear-gradient(165deg, #fbe9a6 0%, #d9a63a 50%, #7a5210 100%); color: #2a1d05; }
.jcard-plata { background: linear-gradient(165deg, #f4f7fa 0%, #aab5c0 50%, #5d6873 100%); color: #101418; }
.jcard-bronce { background: linear-gradient(165deg, #efc596 0%, #b07142 50%, #5a3414 100%); color: #1d0f05; }
.jc-cabecera { display: flex; justify-content: space-between; align-items: flex-start; }
.jc-ovr { display: grid; justify-items: center; min-width: 52px; }
.jc-ovr b { font-family: var(--display); font-size: 3em; line-height: .9; }
.jc-ovr span { font-family: var(--ui); font-weight: 800; letter-spacing: .08em; font-size: .95em; }
.jc-club { width: 38px; height: 38px; object-fit: contain; }
.jc-club-vacio { font-family: var(--ui); font-weight: 700; font-size: .75em; letter-spacing: .06em; }
.jc-foto { width: 100%; height: 150px; object-fit: contain; }
.jc-sin-foto { display: grid; place-items: center; font-family: var(--display); font-size: 6em; opacity: .3; }
.jc-nombre { text-align: center; font-family: var(--display); font-weight: 800; font-size: 1.45em; text-transform: uppercase; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jc-linea { display: flex; justify-content: space-between; font-family: var(--ui); font-weight: 700; font-size: .8em; letter-spacing: .06em; border-top: 1px solid rgba(0, 0, 0, .25); padding-top: 4px; }
.jc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 6px; margin-top: 4px; text-align: center; }
.jc-stat b { display: block; font-family: var(--display); font-size: 1.35em; line-height: 1; }
.jc-stat span { font-family: var(--ui); font-weight: 800; font-size: .68em; letter-spacing: .08em; }

/* ---- Vista previa 3D (modal) ---- */
.m3d { position: fixed; inset: 0; z-index: 60; background: rgba(4, 8, 12, .84); display: grid; place-items: center; padding: 16px; }
.m3d-box { width: min(560px, 96vw); background: var(--panel); border: 1px solid var(--line); padding: 14px; display: grid; gap: 10px; }
.m3d-canvas { width: 100%; height: min(60vh, 520px); display: block; background: #0b1620; }
.m3d-nota { margin: 0; font-family: var(--ui); color: var(--mute); letter-spacing: .06em; text-align: center; }
.m3d-btns { display: flex; justify-content: flex-end; gap: 10px; }

/* Lista de jugadores: club entre corchetes junto al nombre */
.pl-row.jug { grid-template-columns: 48px minmax(0, 1fr) 56px auto; }
.club-box { font-style: normal; font-family: var(--ui); font-weight: 700; font-size: .72em; letter-spacing: .06em; color: var(--mute); border: 1px solid var(--line); padding: 1px 6px; margin-left: 8px; white-space: nowrap; vertical-align: middle; }

/* ---- Menú principal del DT ---- */
.hub-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; filter: blur(2px); }
.hub-bg::after { content: ''; position: absolute; inset: 0; background: rgba(4, 8, 14, .55); }
.hub-bg .estadio, .feed-img .estadio { width: 100%; height: 100%; display: block; }
.hub { position: relative; z-index: 1; min-height: 100vh; box-sizing: border-box; padding: 12px 22px 24px; }
.ico-svg { display: inline-block; vertical-align: middle; flex: none; }
.hub-nav {
  position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 16px;
  align-items: center; padding: 10px 14px; border-radius: 12px; background: rgba(5, 10, 18, .96);
  backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, .08);
  /* casi opaca: el contenido que pasa por debajo no se debe ver a través de la barra */
}
.hub-user { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .25); background: transparent; color: #fff; cursor: pointer; transition: background .2s, border-color .2s; }
.hub-user:hover { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .6); }
.hub-tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; }
.hub-tab {
  display: flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; color: rgba(255, 255, 255, .7);
  font-family: var(--ui); font-weight: 700; letter-spacing: .05em; padding: 8px 10px;
  border-bottom: 2px solid rgba(255, 255, 255, .15); transition: color .18s, border-color .18s, background .18s;
}
.hub-tab:hover { color: #fff; border-bottom-color: rgba(255, 255, 255, .6); background: rgba(255, 255, 255, .05); }
.hub-tab.on { color: #fff; border-bottom: 4px solid var(--card); }
.hub-club { display: flex; align-items: center; gap: 10px; }
.hub-club img { width: 40px; height: 40px; object-fit: contain; }
.hub-club > div > b { font-family: var(--ui); letter-spacing: .04em; white-space: nowrap; }
.hub-conf { display: flex; align-items: center; gap: 8px; font-family: var(--ui); font-size: .72em; letter-spacing: .08em; color: rgba(255, 255, 255, .7); }
.hub-bar { display: inline-block; width: 120px; height: 6px; background: rgba(255, 255, 255, .15); border-radius: 3px; overflow: hidden; }
.hub-bar i { display: block; height: 100%; background: var(--card); transition: width .5s ease; }
.hub-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, .8fr); gap: 22px; margin-top: 20px; align-items: start; }
.hub-fecha { font-family: var(--display); font-size: clamp(2.2rem, 4vw, 3.4rem); line-height: .95; margin: 0; }
.hub-sub { color: rgba(255, 255, 255, .72); margin: 6px 0 16px; font-family: var(--ui); }
.hub-main, .hub-pagina, .hub-evento, .hub-tareas li, .feed-card {
  background: rgba(8, 16, 28, .6); backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, .1);
}
.hub-evento {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; padding: 18px; border-radius: 16px;
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.hub-evento:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, .3); box-shadow: 0 12px 28px rgba(0, 0, 0, .35); }
.hub-ico { width: 84px; height: 84px; display: grid; place-items: center; border-radius: 14px; background: rgba(255, 255, 255, .06); color: var(--card); }
.hub-evento-txt small { font-family: var(--ui); letter-spacing: .12em; color: rgba(255, 255, 255, .6); }
.hub-evento-txt h2 { font-family: var(--display); font-size: 1.5rem; margin: 4px 0 6px; line-height: 1.1; }
.hub-evento-txt p { margin: 0; color: rgba(255, 255, 255, .75); }
.hub-acc { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; }
.hub-msg { grid-column: 1 / -1; margin: 0; }
.hub-h3 { margin: 22px 0 10px; font-family: var(--ui); letter-spacing: .12em; color: rgba(255, 255, 255, .7); }
.hub-tareas { list-style: none; margin: 0; padding: 0; }
.hub-tareas li {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; margin-bottom: 8px;
  font-family: var(--ui); font-weight: 600; transition: background .2s ease, transform .2s ease;
}
.hub-tareas li:hover { background: rgba(8, 16, 28, .8); transform: translateX(3px); }
.hub-tareas li.actual { border-left: 4px solid var(--card); background: rgba(8, 16, 28, .85); font-weight: 800; }
.hub-tareas li.hecha { opacity: .5; }
.hub-tareas li span { flex: 1; }
.hub-feed { display: grid; gap: 16px; align-content: start; max-height: calc(100vh - 150px); overflow-y: auto; padding-right: 4px; }
.feed-card { border-radius: 14px; overflow: hidden; transition: transform .2s ease, box-shadow .2s ease; }
.feed-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0, 0, 0, .4); }
.feed-card header { display: flex; align-items: center; gap: 10px; padding: 12px; }
.feed-card header small { display: block; color: rgba(255, 255, 255, .6); font-family: var(--ui); }
.feed-logo { width: 34px; height: 34px; display: grid; place-items: center; background: #fff; color: #111; font-family: var(--display); font-weight: 900; border-radius: 6px; }
.feed-new { margin-left: auto; background: var(--card); color: #04170d; font-family: var(--ui); font-weight: 800; font-size: .7em; letter-spacing: .08em; padding: 2px 8px; border-radius: 4px; }
.feed-img { height: 150px; overflow: hidden; }
.feed-card h4 { margin: 12px 12px 4px; font-family: var(--display); font-size: 1.2rem; line-height: 1.15; }
.feed-card p { margin: 0 12px 10px; color: rgba(255, 255, 255, .75); }
.feed-card footer { display: flex; gap: 16px; padding: 10px 12px; border-top: 1px solid rgba(255, 255, 255, .1); color: rgba(255, 255, 255, .8); font-family: var(--ui); }
.feed-card footer span { display: flex; align-items: center; gap: 6px; transition: color .18s; cursor: default; }
.feed-card footer span:hover { color: #fff; }
.hub-pagina { border-radius: 16px; padding: 18px; margin-top: 20px; }
.hub-pagina h2 { font-family: var(--display); margin: 0 0 12px; }
.hub-notif-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
@media (max-width: 900px) {
  .hub-nav { grid-template-columns: 1fr; }
  .hub-club { justify-self: center; }
  .hub-grid { grid-template-columns: 1fr; }
  .hub-feed { max-height: none; }
}

/* ---- Plantilla del DT (campo + lista + acciones) ---- */
.plant-layout { display: grid; grid-template-columns: minmax(280px, .9fr) minmax(0, 1.1fr); gap: 18px; align-items: start; margin-bottom: 18px; }
.pitch-wrap { display: grid; gap: 8px; }
.pitch {
  position: relative; width: 100%; aspect-ratio: 68 / 80; border-radius: 14px; overflow: hidden;
  background: repeating-linear-gradient(0deg, #2f7d3c 0 44px, #29703a 44px 88px);
  border: 1px solid rgba(255, 255, 255, .15); box-shadow: inset 0 0 40px rgba(0, 0, 0, .35);
}
.pitch::before { content: ''; position: absolute; inset: 10px; border: 2px solid rgba(255, 255, 255, .35); border-radius: 6px; }
.pitch::after { content: ''; position: absolute; left: 10px; right: 10px; top: 50%; height: 2px; background: rgba(255, 255, 255, .35); }
.pj {
  position: absolute; transform: translate(-50%, -50%); width: 84px; display: grid; justify-items: center; gap: 4px;
  background: none; border: 0; color: #fff; cursor: pointer; transition: transform .18s ease;
}
.pj:hover, .pj:focus-visible { transform: translate(-50%, -52%) scale(1.07); }
.pj .pjc {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display);
  font-weight: 900; font-size: 1.1rem; border: 2px solid rgba(255, 255, 255, .85); box-shadow: 0 4px 10px rgba(0, 0, 0, .45);
}
.pj small {
  font-family: var(--ui); font-weight: 700; font-size: .68em; background: rgba(4, 8, 14, .78); padding: 1px 6px;
  border-radius: 4px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: center; gap: 2px;
}
.pj.on .pjc { outline: 3px solid var(--card); outline-offset: 2px; }
.pj.lesion .pjc { filter: grayscale(1); opacity: .55; }
.rol {
  display: inline-grid; place-items: center; width: 16px; height: 16px; margin-left: 3px; border-radius: 50%;
  font-style: normal; font-size: .62em; font-weight: 900; background: #fff; color: #111; vertical-align: middle;
}
.rol-capitan { background: #f2c230; }
.rol-penales { background: #7fc4ec; }
.rol-faltas { background: #ff8a80; }
.pl-panel {
  background: rgba(8, 16, 28, .7); backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, .1);
  border-radius: 14px; padding: 16px; display: grid; gap: 12px; align-content: start; min-height: 200px;
}
.pl-cab { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.pl-cab-pos { font-family: var(--display); font-weight: 900; color: var(--card); font-size: 1.2rem; }
.pl-cab small { display: block; color: rgba(255, 255, 255, .6); font-family: var(--ui); }
.pl-cab-ovr { font-family: var(--display); font-size: 2.2rem; font-weight: 900; line-height: 1; }
.pl-acc { display: grid; gap: 8px; }
.pl-acc .btn { width: 100%; }
.pl-acc .btn:disabled { opacity: .4; cursor: not-allowed; }
.pl-pos-sel { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: var(--ui); }
.pl-pos-sel b { font-family: var(--display); font-size: 1.3rem; min-width: 60px; text-align: center; }
.pl-attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-family: var(--ui); }
.pl-attrs div { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, .08); padding: 3px 0; }
.pl-roles { display: grid; gap: 6px; }
.pl-roles > span, .pl-pos-sel > span { font-family: var(--ui); letter-spacing: .12em; color: rgba(255, 255, 255, .6); font-size: .8em; }
.pt { display: grid; gap: 6px; }
.pt-row {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) 64px 56px 62px 170px; gap: 8px; align-items: center;
  width: 100%; text-align: left; font: inherit; font-family: var(--ui); font-weight: 600; color: #fff;
  background: rgba(8, 16, 28, .55); border: 1px solid rgba(255, 255, 255, .08); border-radius: 8px; padding: 8px 12px;
  cursor: pointer; transition: background .18s ease, border-color .18s ease, transform .18s ease;
}
.pt-row:hover { background: rgba(8, 16, 28, .85); border-color: rgba(255, 255, 255, .3); transform: translateX(2px); }
.pt-row.on { border-color: var(--card); background: rgba(8, 16, 28, .95); }
.pt-row.lesion { color: #ff8a80; }
.pt-row.pt-h { cursor: default; background: none; border: 0; transform: none; color: rgba(255, 255, 255, .55); letter-spacing: .08em; font-size: .8em; padding: 0 12px; }
.pt-row.pt-h:hover { background: none; }
.pt-pos { font-family: var(--display); font-weight: 900; color: var(--card); }
.pt-nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt-row .tit { font-style: normal; font-size: .72em; letter-spacing: .06em; color: rgba(255, 255, 255, .55); margin-left: 8px; }
.pt-row b { font-family: var(--display); font-size: 1.2rem; }
@media (max-width: 900px) {
  .plant-layout { grid-template-columns: 1fr; }
  .pt-row { grid-template-columns: 40px minmax(0, 1fr) 46px 44px 46px; }
  .pt-row > span:last-child { display: none; }
  .pt-h > span:last-child { display: none; }
}

/* Jugadores del campo como cartas en miniatura */
.pj.pj-carta { width: 66px; gap: 0; }
.pj-cuerpo { display: block; width: 100%; }
.pj-cuerpo .jcard { width: 100%; max-width: none; font-size: 6.5px; padding: 4px 4px 3px; gap: 1px; aspect-ratio: 5 / 6.2; }
.pj-cuerpo .jc-foto { height: 40px; }
.pj-cuerpo .jc-stats, .pj-cuerpo .jc-linea { display: none; }
.pj-cuerpo .jc-nombre { font-size: 1.15em; }
.pj-cuerpo .jc-club { width: 14px; height: 14px; }
.pj-cuerpo .jc-ovr b { font-size: 2em; }
.pj-carta .pj-roles { display: flex; gap: 2px; justify-content: center; min-height: 14px; margin-top: 2px; }
.pj-carta.on .jcard { outline: 3px solid var(--card); outline-offset: 2px; }
.pj-carta:hover .jcard { box-shadow: 0 10px 22px rgba(0, 0, 0, .55); }
.pj-carta.lesion .jcard { filter: grayscale(1); opacity: .6; }

.hub-gear { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .25); background: transparent; color: #fff; cursor: pointer; transition: background .2s, border-color .2s, transform .4s ease; }
.hub-gear:hover { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .6); transform: rotate(60deg); }

/* Tabla de clasificación de la pestaña Central */
.hub-tabla { display: grid; gap: 4px; }
.hub-tabla .ct {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) 64px 64px 72px; align-items: center; gap: 8px;
  padding: 9px 14px; border-radius: 8px; font-family: var(--ui); font-weight: 600; color: #fff;
  background: rgba(8, 16, 28, .55); border: 1px solid rgba(255, 255, 255, .06);
  transition: background .18s ease, border-color .18s ease;
}
.hub-tabla .ct:hover { background: rgba(8, 16, 28, .85); border-color: rgba(255, 255, 255, .25); }
.hub-tabla .ct > span:not(:nth-child(2)) { text-align: right; }
.hub-tabla .ct b { text-align: right; font-family: var(--display); font-size: 1.2rem; }
.hub-tabla .ct.me { border-color: var(--card); background: rgba(8, 16, 28, .95); }
.hub-tabla .ct.me > span:first-child { color: var(--card); font-weight: 900; }
.hub-tabla .ct-h { background: none; border: 0; color: rgba(255, 255, 255, .55); letter-spacing: .08em; font-size: .8em; padding: 4px 14px; }
.hub-tabla .ct-h:hover { background: none; border-color: transparent; }
@media (max-width: 900px) {
  .hub-tabla .ct { grid-template-columns: 32px minmax(0, 1fr) 46px 56px; }
  .hub-tabla .ct > span:nth-child(3) { display: none; }
  .hub-tabla .ct-h > span:nth-child(3) { display: none; }
}


/* ---------------------------------------------- Filtros de personalización */
.pl-fbtn {
  background: var(--panel); color: var(--chalk); border: 1px solid var(--line); padding: 10px 14px;
  font: 800 1em var(--ui); letter-spacing: .08em; cursor: pointer;
}
.pl-fbtn.focus, .pl-fbtn:hover, .pl-fbtn.on { border-color: var(--card); color: var(--card); }
.pl-chip {
  display: inline-flex; align-items: center; gap: 8px; background: var(--card); color: var(--card-ink);
  padding: 6px 10px; font: 800 .95em var(--ui); letter-spacing: .06em;
}
.pl-chip button { background: transparent; border: 0; color: var(--card-ink); font: 900 1em var(--ui); cursor: pointer; padding: 0 2px; }
.pl-filtro-panel {
  width: min(900px, 94vw); margin: 0 auto 10px; background: var(--panel); border: 1px solid var(--card);
  padding: 12px; display: grid; gap: 10px;
}
.pl-filtro-panel .pl-panel-h, .pl-panel-h { display: flex; justify-content: space-between; align-items: center; font-family: var(--ui); letter-spacing: .08em; }
.pl-fcerrar { background: transparent; color: var(--mute); border: 1px solid var(--line); padding: 6px 10px; font: 800 .9em var(--ui); cursor: pointer; }
.pl-fcerrar.focus, .pl-fcerrar:hover { color: var(--card); border-color: var(--card); }
.pl-fopts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; max-height: 40vh; overflow-y: auto; }
.pl-fopt {
  display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left;
  background: var(--panel-2); color: var(--chalk); border: 1px solid var(--line); padding: 8px 10px; font: inherit; cursor: pointer;
}
.pl-fopt b { font-family: var(--ui); }
.pl-fopt small { color: var(--mute); font-family: var(--ui); }
.pl-fopt.focus, .pl-fopt:hover { border-color: var(--card); }
.pl-fopt[hidden], .pl-vacio-f[hidden] { display: none; }

/* ---------------------------------------------- Subtítulo PRO SOCCER y créditos */
.brand-sub { display: block; font: 700 .95em var(--ui); letter-spacing: 0.5em; color: var(--mute); margin-top: 4px; }
.logo-sub { font: 700 .9em var(--ui); letter-spacing: 0.5em; color: var(--mute); margin-top: .4em; }
.credits { width: min(760px, 92vw); margin: 4vh auto 0; display: grid; gap: 18px; font-family: var(--ui); }
.credits p { display: grid; gap: 4px; margin: 0; padding: 14px 18px; background: var(--panel); border: 1px solid var(--line); }
.credits p > span { color: var(--mute); letter-spacing: .12em; font-size: .9em; text-transform: uppercase; }
.credits p > b, .credits a { font-size: 1.25em; color: var(--chalk); font-weight: 700; }
.credits a { color: var(--card); text-decoration: none; word-break: break-all; }
.credits a:hover, .credits a:focus { text-decoration: underline; }
.credits-links { display: grid; gap: 10px; }

/* ---------------------------------------------------- UEFA Champions */
.ch-wrap { width: min(1100px, 96vw); margin: 0 auto; display: grid; gap: 18px; }
.ch-grupos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.ch-grp, .ch-ronda { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; font-family: var(--ui); }
.ch-grp h4, .ch-ronda h4 { margin: 0 0 6px; letter-spacing: .12em; color: var(--mute); font-size: .95em; }
.ch-row { display: grid; grid-template-columns: 24px 1fr 30px 36px; gap: 6px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.ch-row span:nth-child(3), .ch-row b { text-align: right; }
.ch-row.me { background: var(--panel-2); color: var(--card); }
.ch-ko { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.ch-match { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 8px; align-items: center; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.ch-match > span:nth-child(3) { text-align: left; }
.ch-match b { text-align: center; min-width: 52px; }
.ch-match.me { color: var(--card); }
.ch-match i { font-style: normal; color: var(--mute); font-size: .85em; }
.credits-aviso { border-color: var(--card) !important; }
.credits-aviso span { color: var(--card) !important; }
.liga-pick { margin-bottom: 6px; }
.liga-pick .row-v b { font-family: var(--ui); letter-spacing: .04em; }

/* ---- Asistente de primera vez (dirección y controles) ---- */
.setup { max-width: 1000px; margin: 0 auto; padding: 24px; }
.setup-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 12px; }
.setup-card {
  background: rgba(8, 16, 28, .7); backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 16px; padding: 18px; display: grid; gap: 10px; align-content: start; transition: border-color .2s ease, transform .2s ease;
}
.setup-card:hover { border-color: rgba(255, 255, 255, .35); transform: translateY(-2px); }
.setup-card h2 { font-family: var(--display); margin: 0; }
.setup-card p { margin: 0; color: rgba(255, 255, 255, .75); }
.setup-acc { display: flex; gap: 10px; flex-wrap: wrap; }
.setup-keys { font-size: .9em; }
.setup-ej { margin-top: 16px; display: grid; gap: 10px; justify-items: center; background: rgba(8, 16, 28, .6); padding: 16px; border-radius: 14px; text-align: center; }
.setup-ej svg { width: min(440px, 100%); height: auto; }
.setup-ej p { margin: 0; color: rgba(255, 255, 255, .8); }
.ej-linea { animation: ejFlow 1.2s linear infinite; }
@keyframes ejFlow { to { stroke-dashoffset: -28; } }
.ej-teclas { display: grid; justify-items: center; gap: 6px; }
.ej-teclas kbd { display: inline-block; min-width: 36px; text-align: center; margin: 2px; }
.setup-pie { margin-top: 14px; }
@media (max-width: 800px) { .setup-cards { grid-template-columns: 1fr; } }

/* ---- Creación de DT: aspecto, edad y ligas ---- */
.dt-new { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 14px; }
.dt-new-col { display: grid; gap: 8px; align-content: start; }
.dt-new-col h3 { font-family: var(--ui); letter-spacing: .12em; color: rgba(255, 255, 255, .7); margin: 0; }
.dt-prev { width: 260px; height: 320px; justify-self: center; border-radius: 14px; background: #0b1620; border: 1px solid rgba(255, 255, 255, .12); }
.dt-ligas { display: flex; flex-wrap: wrap; gap: 8px; }
.pal { grid-template-columns: 70px minmax(0, 1fr) 60px minmax(0, 1fr) 70px; }
@media (max-width: 800px) { .dt-new { grid-template-columns: 1fr; } }

/* ------------------------------------------------ Partido: estadísticas en vivo */
.livestats {
  position: absolute; top: 86px; left: 50%; transform: translateX(-50%); z-index: 40;
  width: min(480px, 92vw); padding: 10px 14px; background: rgba(8, 14, 24, .86);
  border: 1px solid var(--line); font-family: var(--ui); color: var(--chalk); pointer-events: none;
}
.livestats[hidden] { display: none; }
.ls-h { display: flex; justify-content: space-between; font-weight: 800; letter-spacing: .12em; color: var(--mute); margin-bottom: 6px; }
.ls-r { display: grid; grid-template-columns: 110px 1fr 110px; gap: 8px; align-items: center; padding: 3px 0; }
.ls-r > b:first-child { text-align: right; }
.ls-m span { display: block; font-size: .72em; letter-spacing: .1em; color: var(--mute); text-align: center; }
.ls-b { display: flex; height: 6px; background: var(--panel-2); }
.ls-b i { background: var(--card); display: block; }
.ls-b u { background: var(--red); display: block; }

/* ------------------------------------------- Cambios, calor, entrenamiento */
.subs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: min(900px, 94vw); margin: 0 auto; }
.subs-col h3 { font: 800 1em var(--ui); letter-spacing: .14em; color: var(--mute); margin-bottom: 6px; }
.heat { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; width: min(1100px, 94vw); margin: 0 auto; align-items: start; }
.heat-l { display: grid; gap: 8px; }
.heat-l .btn { width: 100%; }
.heat-r { display: grid; gap: 6px; }
.heat-cv { width: 100%; height: auto; background: #1d6b35; border: 1px solid var(--line); }
.tr-list { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; font: 700 1.05em var(--ui); margin: 14px 0; max-width: 640px; }
.tr-list .ok { color: var(--turf); }
.tr-list .no { color: var(--mute); }
@media (max-width: 760px) { .subs, .heat { grid-template-columns: 1fr; } }

/* ------------------------------------------------ Filtros de las listas */
.pl-chips { width: min(900px, 94vw); margin: 0 auto 10px; display: flex; flex-wrap: wrap; gap: 8px; }
.pl-chip-f {
  background: var(--panel); color: var(--mute); border: 1px solid var(--line);
  padding: 6px 10px; font: 700 .85em var(--ui); letter-spacing: .08em; cursor: pointer;
}
.pl-chip-f b { color: var(--chalk); font-weight: 800; }
.pl-chip-f.on { border-color: var(--card); }
.pl-chip-f.clear { color: var(--red); }
.pl-chip-f:focus-visible, .pl-chip-f.focus { outline: 2px solid var(--chalk); }

/* ------------------------------------------------- Transferencias (DT) */
.tr-tiles { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 18px; width: min(1000px, 96vw); margin: 4vh auto 0; }
.tr-tile { display: grid; justify-items: center; align-content: center; gap: 10px; min-height: 220px; padding: 26px 18px; cursor: pointer; background: var(--panel); color: var(--chalk); border: 1px solid var(--line); font: inherit; text-align: center; transition: transform .15s, border-color .15s; }
.tr-tile.focus, .tr-tile:hover { border-color: var(--card); transform: translateY(-3px); }
.tr-tile b { font-family: var(--display); font-size: 1.5em; letter-spacing: .04em; }
.tr-tile small { color: var(--mute); font-family: var(--ui); font-size: 1em; }
.tr-ico { width: 56px; height: 56px; color: var(--card); display: grid; place-items: center; }
.tr-ico svg { width: 100%; height: 100%; }
.tr-num { font: 900 2.6em var(--display); color: var(--card); }
@media (max-width: 760px) { .tr-tiles { grid-template-columns: 1fr; } }
.tr-filters { width: min(900px, 94vw); margin: 0 auto 10px; display: grid; gap: 8px; }
.tr-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 60px 44px 90px auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; font-family: var(--ui); }
.tr-row .tr-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.tr-row .btn.sm { padding: 6px 10px; font-size: .9em; white-space: nowrap; }
.tr-ok { color: var(--turf); font-weight: 800; letter-spacing: .06em; font-size: .9em; }
.tr-neg { grid-template-columns: 170px minmax(0, 1fr) 90px auto auto; }
.tr-tag { color: var(--card); font-weight: 800; letter-spacing: .08em; font-size: .85em; }
.tr-tag.no { color: var(--red); }
.pl-list { width: min(900px, 94vw); margin: 0 auto; }

/* ---------------------------------------------------- Calendario */
.cal-tabla { display: grid; gap: 4px; font-family: var(--ui); margin-bottom: 18px; }
.cal-row { display: grid; grid-template-columns: 44px 110px 110px minmax(0,1fr) 90px; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; }
.cal-row.hoy { border-color: var(--card); }
.cal-j { color: var(--card); font-weight: 800; }
.cal-h { color: var(--mute); font-size: .9em; letter-spacing: .06em; }
.cal-m { text-align: right; font-weight: 800; }
.cal-row > b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ----------------------------------------------- Escena de la oficina */
.cine { min-height: 100vh; display: grid; grid-template-rows: 1fr auto auto; background: #05080d; color: var(--chalk); }
.cine-escena { position: relative; overflow: hidden; height: min(62vh, 560px); }
.cine-escena svg { width: 100%; height: 100%; display: block; animation: cine-zoom 14s ease-out forwards, cine-fade .8s ease-out; transform-origin: 62% 50%; }
@keyframes cine-zoom { from { transform: scale(1.08); } to { transform: scale(1); } }
@keyframes cine-fade { from { opacity: 0; } to { opacity: 1; } }
.cine-txt { max-width: 880px; width: min(880px, 94vw); margin: 0 auto; padding: 18px 22px; border-left: 4px solid var(--card); background: rgba(8,14,24,.85); }
.cine-nombre { font-family: var(--ui); letter-spacing: .14em; color: var(--card); font-weight: 800; font-size: .95em; }
.cine-txt p { font-family: var(--ui); font-size: 1.35em; line-height: 1.5; margin: 8px 0 0; min-height: 3.2em; }
.cine-btns { display: flex; justify-content: flex-end; padding: 14px 4vw 22px; }
@media (prefers-reduced-motion: reduce) { .cine-escena svg { animation: none; } }

/* ------------------------------------------------ Agente y contrato */
.ag-box { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--panel); border-left: 4px solid var(--mute); font-family: var(--ui); }
.ag-box b { letter-spacing: .08em; }
.ag-box p { margin: 6px 0; }
.ag-box small { color: var(--mute); }
.ag-sonrisa { border-left-color: var(--turf); }
.ag-sonrisa b { color: var(--turf); }
.ag-brazos { border-left-color: var(--card); }
.ag-brazos b { color: var(--card); }
.ag-niega { border-left-color: var(--red); }
.ag-niega b { color: var(--red); }
.ag-exige { border-left-color: var(--card); }

/* ------------------------------------------- Negociación en la oficina */
.cine.nego { grid-template-rows: auto auto auto; min-height: 100vh; }
.nego-escena { height: min(40vh, 380px); }
.nego-dialogo { max-width: 960px; width: min(960px, 94vw); margin: 0 auto; padding: 14px 18px; background: rgba(8,14,24,.92); border-left: 4px solid var(--card); font-family: var(--ui); }
.nego-meta { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; color: var(--mute); font-size: .95em; margin-bottom: 8px; }
.nego-meta b { color: var(--chalk); font-size: 1.2em; letter-spacing: .04em; }
.nego-linea { font-size: 1.15em; line-height: 1.45; margin: 4px 0; }
.nego-linea span { color: var(--card); font-weight: 800; letter-spacing: .06em; }
.nego-linea.club span { color: var(--turf); }
.nego-linea.club b { font-weight: 600; }
.nego-controles { max-width: 960px; width: min(960px, 94vw); margin: 0 auto; display: grid; gap: 8px; padding: 10px 0 20px; }
.nego-btns { flex-wrap: wrap; }

/* ---- Plantilla v1.2: campo interactivo, banca de suplentes y arrastre ---- */
.pj.pj-carta { touch-action: none; cursor: grab; }
.pj.pj-carta:active { cursor: grabbing; }
.pj.pj-carta.arrastrando { opacity: .35; }
.pj.pj-carta.pj-destino .jcard { outline: 3px dashed #f2c230; outline-offset: 3px; }
.pj.pj-carta.objetivo .jcard { box-shadow: 0 0 0 2px rgba(242, 194, 48, .5); }
.pj-hueco {
  position: absolute; transform: translate(-50%, -50%); width: 66px; height: 92px; display: grid; place-items: center;
  border: 2px dashed rgba(255, 255, 255, .35); border-radius: 10px; color: rgba(255, 255, 255, .5);
  font-family: var(--ui); font-size: .7em; letter-spacing: .08em;
}
.pj-hueco.pj-destino { border-color: #f2c230; color: #f2c230; }
.drag-ghost {
  position: fixed; z-index: 999; width: 66px; pointer-events: none; transform: translate(-50%, -50%) rotate(-3deg);
  filter: drop-shadow(0 12px 18px rgba(0, 0, 0, .55));
}
.drag-ghost .jcard { width: 100%; max-width: none; font-size: 6.5px; padding: 4px 4px 3px; gap: 1px; aspect-ratio: 5 / 6.2; }
.drag-ghost .jc-foto { height: 40px; }
.drag-ghost .jc-stats, .drag-ghost .jc-linea { display: none; }
.sup-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.sup-card {
  width: 84px; display: grid; justify-items: center; gap: 4px; padding: 6px; border-radius: 12px; cursor: pointer;
  background: rgba(8, 16, 28, .55); border: 1px solid rgba(255, 255, 255, .1); color: #fff;
  transition: transform .18s ease, border-color .18s ease, background .18s ease;
}
.sup-card:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, .4); background: rgba(8, 16, 28, .85); }
.sup-card.on { border-color: #f2c230; box-shadow: 0 0 0 2px rgba(242, 194, 48, .35); }
.sup-card.lesion { opacity: .55; }
.sup-card .pj-cuerpo { width: 72px; }
.sup-card .pj-cuerpo .jcard { font-size: 6.5px; }
.sup-estado { font-family: var(--ui); font-size: .62em; letter-spacing: .06em; color: rgba(255, 255, 255, .6); }

/* ---- Online: tarjetas, salas y torneo ---- */
.ol-nombre { max-width: 420px; margin: 8px auto 4px; }
.ot-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; max-width: 980px; margin: 22px auto; }
.ot-grid.ot-dos { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 720px; }
.ot {
  position: relative; min-height: 190px; padding: 22px; display: grid; align-content: space-between; gap: 12px; text-align: left;
  background: rgba(8, 16, 28, .65); backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, .12); border-radius: 16px;
  color: #fff; cursor: pointer; font: inherit; transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.ot:hover, .ot:focus-visible { transform: translateY(-4px); border-color: rgba(255, 255, 255, .5); box-shadow: 0 14px 30px rgba(0, 0, 0, .4); }
.ot-t { font-family: var(--display); font-size: 1.6rem; font-weight: 900; line-height: 1; }
.ot-d { font-family: var(--ui); color: rgba(255, 255, 255, .72); line-height: 1.35; }
.ot-soon { opacity: .55; cursor: not-allowed; border-style: dashed; }
.ot-soon:hover { transform: none; box-shadow: none; border-color: rgba(255, 255, 255, .12); }
.ot-badge { justify-self: start; font-family: var(--ui); font-weight: 800; font-size: .72em; letter-spacing: .12em; padding: 4px 10px; border-radius: 6px; background: rgba(255, 255, 255, .1); }
.ol-panel { max-width: 560px; margin: 16px auto; background: rgba(8, 16, 28, .7); backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, .12); border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
.ol-cred { display: flex; justify-content: space-between; align-items: center; font-family: var(--ui); letter-spacing: .08em; padding: 10px 14px; background: rgba(255, 255, 255, .05); border-radius: 10px; }
.ol-cred b { font-family: var(--display); font-size: 1.6rem; letter-spacing: .2em; }
.ol-estado { font-family: var(--ui); margin: 0; }
.ol-lista { margin: 0; padding-left: 18px; font-family: var(--ui); }
.ol-partido { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, .04); font-family: var(--ui); }
.ol-partido.hecho { opacity: .6; }
.ol-eq { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ol-gol { display: inline-flex; align-items: center; gap: 4px; }
.ol-gol b { min-width: 22px; text-align: center; font-family: var(--display); font-size: 1.2rem; }
.ol-x { color: rgba(255, 255, 255, .5); }
@media (max-width: 800px) { .ot-grid, .ot-grid.ot-dos { grid-template-columns: 1fr; } .ol-partido { grid-template-columns: 1fr auto; } }

/* ---- Tu Club ---- */
.ot-grid { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.tc-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(240px, .9fr); gap: 18px; max-width: 980px; margin: 14px auto; align-items: start; }
.tc-logo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--ui); }
.tc-logo > span:first-child { letter-spacing: .12em; color: rgba(255, 255, 255, .7); }
.tc-base { font-family: var(--display); font-size: 1.2rem; min-width: 180px; text-align: center; }
.tc-errores { margin: 0; padding-left: 18px; }
.tc-card {
  display: grid; justify-items: center; gap: 8px; padding: 24px; border-radius: 16px; text-align: center;
  background: rgba(8, 16, 28, .7); backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, .12);
}
.tc-escudo { width: 150px; height: 150px; object-fit: contain; }
.tc-nombre { font-family: var(--display); font-size: 1.5rem; }
.tc-usuario { font-family: var(--ui); color: rgba(255, 255, 255, .75); letter-spacing: .06em; }
.tc-meta { font-family: var(--ui); color: rgba(255, 255, 255, .5); font-size: .85em; }
@media (max-width: 800px) { .tc-grid { grid-template-columns: 1fr; } }

/* ---- Controles táctiles (móvil): botones circulares y translúcidos ---- */
.touch-ui { position: fixed; inset: 0; z-index: 40; pointer-events: none; user-select: none; -webkit-user-select: none; touch-action: none; }
.touch-ui[hidden] { display: none; }
.tc-joy { position: absolute; left: calc(env(safe-area-inset-left, 0px) + 22px); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); width: 128px; height: 128px; pointer-events: auto; touch-action: none; }
.tc-joy-base { position: absolute; inset: 0; border-radius: 50%; background: rgba(255, 255, 255, .06); border: 1.5px solid rgba(255, 255, 255, .22); }
.tc-joy-knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 255, 255, .28); transition: transform .05s linear; }
.tc-btns { position: absolute; inset: 0; pointer-events: none; }
.tc-b {
  position: absolute; border-radius: 50%; display: grid; place-items: center; padding: 0; pointer-events: auto; touch-action: none;
  background: rgba(8, 16, 28, .32); border: 1.5px solid rgba(255, 255, 255, .32); color: rgba(255, 255, 255, .92);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
  font-family: var(--ui); font-weight: 800; letter-spacing: .03em; transition: transform .08s ease, background .12s ease;
}
.tc-b span { font-size: .72em; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
.tc-tiro { width: 92px; height: 92px; right: calc(env(safe-area-inset-right, 0px) + 14px); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
.tc-pase { width: 80px; height: 80px; right: calc(env(safe-area-inset-right, 0px) + 116px); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); }
.tc-sprint { width: 66px; height: 66px; right: calc(env(safe-area-inset-right, 0px) + 36px); bottom: calc(env(safe-area-inset-bottom, 0px) + 116px); }
.tc-cambio { width: 44px; height: 44px; right: calc(env(safe-area-inset-right, 0px) + 112px); bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); }
.tc-cambio span { font-size: 1.1em; }
.tc-b.on { transform: scale(.94); background: rgba(242, 194, 48, .6); border-color: #f2c230; color: #111; }
.tc-pausa {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px);
  width: 40px; height: 40px; border-radius: 50%; background: rgba(8, 16, 28, .32); border: 1.5px solid rgba(255, 255, 255, .3);
  color: rgba(255, 255, 255, .9); pointer-events: auto; touch-action: none; font-size: .8em;
}
.tc-pausa.on { background: rgba(242, 194, 48, .6); color: #111; }
/* Adaptación a móvil: objetivos táctiles grandes, una columna y sin textos de teclado */
.movil .hint { display: none; }
.movil .pc-only { display: none; }
.movil .btn, .movil .arrow, .movil .mi, .movil .ot, .movil .sup-card { min-height: 44px; }
.movil .btn { padding: 12px 16px; }
.movil .ot-grid, .movil .ot-grid.ot-dos, .movil .setup-cards, .movil .tc-grid, .movil .dt-new { grid-template-columns: 1fr; }
.movil .ot { min-height: 120px; }
.movil .head h1 { font-size: 1.6rem; }
.movil .setup { padding: 14px; }
.movil .plant-layout { grid-template-columns: 1fr; }
.movil .pt-row, .movil .ct { font-size: .9em; }
.movil .hub-nav { grid-template-columns: 1fr; }
.movil .hub-tabs { overflow-x: auto; flex-wrap: nowrap; justify-content: flex-start; }
.movil .hub-tab { white-space: nowrap; min-height: 44px; }
.movil .hub-feed { max-height: none; }
.movil .sup-grid { justify-content: center; }

/* Aviso de gráfica perdida */
.gl-aviso { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: rgba(4, 8, 14, .8); }
.gl-aviso[hidden] { display: none; }
.gl-aviso-caja { max-width: 420px; padding: 22px; border-radius: 14px; background: rgba(8, 16, 28, .9); border: 1px solid rgba(255, 255, 255, .15); display: grid; gap: 14px; text-align: center; font-family: var(--ui); }

/* Botón de volver (solo móvil) */
.volver-movil {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: calc(env(safe-area-inset-left, 0px) + 8px);
